<!doctype html>
<html lang="en" data-desk="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Birdie</title>
    <script>
      // Match the desk to the reader's saved theme before first paint.
      try {
        var s = JSON.parse(localStorage.getItem("birdie.state.v1") || "{}");
        document.documentElement.dataset.desk = (s.prefs && s.prefs.theme) || "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="viewer" class="viewer"></div>
    <script type="module" src="/src/viewer/viewer.ts"></script>
  </body>
</html>
